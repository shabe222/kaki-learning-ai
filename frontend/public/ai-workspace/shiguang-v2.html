<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>拾光漫游 · 独立学习游戏</title>
  <link rel="stylesheet" href="/ai-workspace/styles/adventure-v2.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      color: #f5e9d8;
      font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      /* 夜空渐变 + 地平线暖光，告别单一深棕 */
      background:
        radial-gradient(1100px 460px at 50% -8%, rgba(126, 164, 196, .22), transparent 62%),
        radial-gradient(760px 320px at 84% 12%, rgba(240, 191, 112, .18), transparent 58%),
        linear-gradient(180deg, #232c3a 0%, #33261b 52%, #221710 100%);
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(1.6px 1.6px at 14% 20%, rgba(255,241,205,.85), transparent 100%),
        radial-gradient(1.2px 1.2px at 28% 9%, rgba(255,255,255,.6), transparent 100%),
        radial-gradient(1.4px 1.4px at 41% 26%, rgba(255,238,200,.7), transparent 100%),
        radial-gradient(1.1px 1.1px at 55% 13%, rgba(255,255,255,.5), transparent 100%),
        radial-gradient(1.5px 1.5px at 68% 22%, rgba(255,241,205,.75), transparent 100%),
        radial-gradient(1.2px 1.2px at 80% 8%, rgba(255,255,255,.55), transparent 100%),
        radial-gradient(1.3px 1.3px at 90% 18%, rgba(255,240,200,.65), transparent 100%);
    }
    #launcher { display: flex; min-height: 100vh; align-items: center; justify-content: center; flex-direction: column; gap: 18px; position: relative; }
    #launcher h1 {
      font: 700 clamp(28px, 4vw, 40px)/1.3 "STSong", serif;
      letter-spacing: .12em;
      background: linear-gradient(120deg, #ffe9b8 10%, #f2b767 48%, #d98a58 90%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 3px 14px rgba(0,0,0,.35));
    }
    #launcher p { color: rgba(245,233,216,.75); font-size: 14px; max-width: 420px; text-align: center; line-height: 1.7; }
    #adventureEntry { min-width: 260px; padding: 16px 22px; border: 1px solid rgba(255,220,170,.45); border-radius: 18px; color: #fff2dd; font: 700 17px "STSong", serif; letter-spacing: .12em; background: linear-gradient(140deg, #7a5230, #5d3a24); box-shadow: 0 0 0 1px rgba(255,220,170,.14), 0 14px 36px rgba(0,0,0,.45), 0 4px 18px rgba(255,170,90,.14); cursor: pointer; transition: transform .18s ease, box-shadow .18s ease; }
    #adventureEntry:hover { transform: translateY(-3px); box-shadow: 0 0 0 1px rgba(255,220,170,.22), 0 20px 44px rgba(0,0,0,.5), 0 6px 24px rgba(255,170,90,.2); }
    #adventureEntry small { display: block; margin-top: 5px; font: 500 11px sans-serif; letter-spacing: .04em; color: rgba(255,238,210,.8); }
    #app { min-height: 100vh; }
    .launcher-note { font-size: 11px; color: rgba(245,233,216,.4); }
    .launcher-steps { display: flex; align-items: center; gap: 12px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }
    .launcher-steps span { display: inline-flex; align-items: center; gap: 7px; color: rgba(245,233,216,.82); font-size: 13px; }
    .launcher-steps b { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; color: #3a2a1c; background: #e8c48a; font: 700 12px serif; }
    .launcher-steps i { width: 26px; height: 1px; background: rgba(232,196,138,.45); }
  </style>
</head>
<body>
  <div id="launcher">
    <h1>拾光漫游</h1>
    <p>输入一个你还没学会的学习主题，以玩家身份进入一场冒险。敌人是你的误解，答题就是学习本身。</p>
    <div class="launcher-steps" aria-label="三步玩法"><span><b>1</b>写下主题</span><i></i><span><b>2</b>出招答题</span><i></i><span><b>3</b>挑战守关</span></div>
    <button id="adventureEntry" type="button" aria-label="拾光漫游"><span>开始拾光漫游</span><small>任意主题 · 分页阅读 · 点击互动</small></button>
    <div class="launcher-note">视觉小说式学习冒险 · 敌人是你的误解，答题就是学习本身 · 进度保存在当前会话</div>
  </div>

  <!-- 游戏挂载容器（与 ai-workspace 脚本契约一致；独立模式需可见，overlay 为 fixed 全屏） -->
  <section id="app" class="app">
    <div id="messages" aria-live="polite"></div>
    <textarea id="input" aria-label="输入"></textarea>
  </section>

  <!-- 声音管理器（可选，缺失时游戏自动降级） -->
  <script src="/audio/kaki-audio-manager.js"></script>
  <script src="/ai-workspace/scripts/config.js"></script>

  <!-- 独立游戏智能体 API 客户端：指向 game_agent 服务 -->
  <script>
    (function () {
      'use strict';
      var GAME_API = window.ML_CONFIG && window.ML_CONFIG.GAME_API_BASE_URL
        ? window.ML_CONFIG.GAME_API_BASE_URL
        : (localStorage.getItem('shiguang_game_api') || 'http://127.0.0.1:8901');

      function request(path, body) {
        var opts = { method: 'GET', headers: { 'Accept': 'application/json' } };
        if (body !== undefined) {
          opts.method = 'POST';
          opts.headers['Content-Type'] = 'application/json; charset=utf-8';
          opts.body = JSON.stringify(body);
        }
        return fetch(GAME_API + path, opts).then(function (res) {
          if (!res.ok) return res.json().then(function (data) {
            var e = new Error((data && data.detail) || ('HTTP ' + res.status));
            e.status = res.status; throw e;
          });
          return res.json();
        }).then(function (envelope) { return envelope && envelope.data; });
      }

      window.apiClient = {
        threadId: '',
        getCurrentHarvestAdventure: function () { return Promise.resolve(null); },
        startHarvestAdventure: function (topic, magicSchool, sourceIds, context) {
          return request('/api/game/start', {
            topic: topic,
            magic_school: magicSchool,
            identity_id: (context && context.identity_id) || null,
            talent_id: (context && context.talent_id) || null
          });
        },
        advanceHarvestAdventure: function (runId, action, payload) {
          return request('/api/game/advance', { run_id: runId, action: action, payload: payload || {} });
        },
        getHarvestAdventureRewards: function () {
          return Promise.resolve({ catalog_count: 1, owned_count: 0, equip_slot: 'journey_seal', equipped: null, items: [] });
        },
        equipHarvestAdventureReward: function () { return Promise.resolve({ status: 'equipped', equipped: null, items: [] }); },
        unequipHarvestAdventureReward: function () { return Promise.resolve({ status: 'unequipped', equipped: null, items: [] }); },
        prepareHarvestAdventure: function () { return Promise.resolve(null); },
        adjustPreparedAdventure: function () { return Promise.resolve(null); }
      };
    })();
  </script>

  <!-- 游戏智能体运行时脚本 -->
  <script src="/ai-workspace/scripts/adventure-scene-registry.js"></script>
  <script src="/ai-workspace/scripts/adventure-spell-registry.js"></script>
  <script src="/ai-workspace/scripts/adventure-spell-director.js"></script>
  <script src="/ai-workspace/scripts/adventure-enemy-director.js"></script>
  <script src="/ai-workspace/scripts/adventure-badge-registry.js"></script>
  <script src="/ai-workspace/scripts/shiguang-adventure.js"></script>
</body>
</html>
